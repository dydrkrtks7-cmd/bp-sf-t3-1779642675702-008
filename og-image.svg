<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="608" cy="30" r="71" fill="#991b1b" opacity="0.16"/>
    <circle cx="958" cy="63" r="83" fill="#991b1b" opacity="0.14"/>
    <circle cx="35" cy="275" r="76" fill="#991b1b" opacity="0.11"/>
    <circle cx="783" cy="139" r="23" fill="#991b1b" opacity="0.11"/>
    <circle cx="264" cy="483" r="72" fill="#991b1b" opacity="0.12"/>
    <circle cx="101" cy="463" r="91" fill="#991b1b" opacity="0.16"/>
    <rect x="226" y="-54" width="96" height="68" rx="8" fill="#b91c1c" opacity="0.10" transform="rotate(38, -11, 297)"/>
    <rect x="1018" y="129" width="64" height="48" rx="8" fill="#b91c1c" opacity="0.13" transform="rotate(21, 719, -5)"/>
    <rect x="126" y="616" width="84" height="63" rx="8" fill="#b91c1c" opacity="0.04" transform="rotate(44, 957, 450)"/>
    <rect x="875" y="75" width="61" height="66" rx="8" fill="#b91c1c" opacity="0.05" transform="rotate(27, 430, 161)"/>
    <rect x="856" y="664" width="97" height="50" rx="8" fill="#b91c1c" opacity="0.14" transform="rotate(42, 108, 280)"/>
    <rect x="751" y="-66" width="39" height="26" rx="8" fill="#b91c1c" opacity="0.11" transform="rotate(24, 55, 72)"/>
    <rect x="736" y="217" width="64" height="20" rx="8" fill="#b91c1c" opacity="0.05" transform="rotate(5, 603, 355)"/>
    <rect x="1217" y="664" width="48" height="91" rx="8" fill="#b91c1c" opacity="0.08" transform="rotate(13, 95, -95)"/>
    <polygon points="202,579 224,623 180,623" fill="#991b1b" opacity="0.04"/>
    <polygon points="61,182 119,298 3,298" fill="#991b1b" opacity="0.11"/>
    <polygon points="671,26 715,114 627,114" fill="#991b1b" opacity="0.12"/>
    <polygon points="291,376 366,526 216,526" fill="#991b1b" opacity="0.06"/>

  <!-- Wave at bottom -->
  <path d="M0,566 C360,598 840,534 1200,566 L1200,630 L0,630Z" fill="#991b1b" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    화곡 셔츠룸
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    마포 — 힙플레이스 카페
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#fca5a5" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#fca5a5" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    마포 화곡 셔츠룸 — 힙플레이스 카페
  </text>
</svg>